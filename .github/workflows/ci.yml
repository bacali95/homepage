name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a release (tag) run midway through publishing.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint, typecheck, format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Lint (oxlint)
        run: bun lint

      - name: Typecheck
        run: bun check

      - name: Format check (prettier)
        run: bun format:check

  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Unit tests
        run: bun run test

  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Build
        run: bun run build
        env:
          DATABASE_URL: file:./data/apps.db

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: |
            dist/
            dist-server/
          if-no-files-found: error
          retention-days: 3

  e2e:
    name: E2E (Playwright)
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Download build output
        uses: actions/download-artifact@v8
        with:
          name: build

      - name: Get Playwright version
        id: playwright
        run: echo "version=$(bunx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright chromium and system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      # test:e2e is plain `playwright test`; the webServer runs start.sh against
      # the downloaded dist/ and dist-server/, so nothing is rebuilt here.
      - name: Run e2e tests
        run: bun run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Docker image
    needs: [lint, test, build, e2e]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
      PUSH: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v7

      - name: Download build output
        uses: actions/download-artifact@v8
        with:
          name: build

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=Homelab Homepage
            org.opencontainers.image.description=Homepage application for managing and displaying homelab services

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (load locally)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          IMAGE=$(echo "$TAGS" | head -n1)
          DATA_DIR=$(mktemp -d)
          chmod 777 "$DATA_DIR"
          docker run -d --name smoke -p 3001:3001 \
            -v "$DATA_DIR:/app/data" \
            -e DATABASE_URL=file:./data/apps.db \
            "$IMAGE"

          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3001/healthz >/dev/null 2>&1; then
              echo "healthz OK after ${i}s"
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' smoke)" != "true" ]; then
              echo "::error::Container exited early"
              exit 1
            fi
            if [ "$i" = "60" ]; then
              echo "::error::Timed out waiting for /healthz"
              exit 1
            fi
            sleep 1
          done

          if ! curl -fsS http://localhost:3001/ | grep -qi "<html"; then
            echo "::error::GET / did not return HTML"
            exit 1
          fi

      - name: Dump container logs on failure
        if: failure()
        run: docker logs smoke || true

      - name: Push image
        if: env.PUSH == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
